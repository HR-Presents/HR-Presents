<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="215" viewBox="0 0 1200 215"><title>HR-Presents delivery workflow: scope, build, verify and handover</title><rect width="1200" height="215" rx="12" fill="#172126"/><text x="28" y="38" fill="#A3C9DA" font-family="Arial" font-size="20" font-weight="700">From requirement to handover</text><text x="28" y="66" fill="#CDD5D4" font-family="Arial" font-size="16">A clear scope, practical engineering and documented delivery.</text><rect x="28" y="94" width="265" height="87" rx="10" fill="#223138"/><text x="45" y="122" fill="#A3C9DA" font-family="Arial" font-size="15">01</text><text x="45" y="154" fill="#F4F1E9" font-family="Arial" font-size="20">Agree the scope</text><path d="M299 138H314M309 133L314 138L309 143" fill="none" stroke="#A3C9DA" stroke-width="2"/><rect x="321" y="94" width="265" height="87" rx="10" fill="#223138"/><text x="338" y="122" fill="#A3C9DA" font-family="Arial" font-size="15">02</text><text x="338" y="154" fill="#F4F1E9" font-family="Arial" font-size="20">Build the work</text><path d="M592 138H607M602 133L607 138L602 143" fill="none" stroke="#A3C9DA" stroke-width="2"/><rect x="614" y="94" width="265" height="87" rx="10" fill="#223138"/><text x="631" y="122" fill="#A3C9DA" font-family="Arial" font-size="15">03</text><text x="631" y="154" fill="#F4F1E9" font-family="Arial" font-size="20">Check the result</text><path d="M885 138H900M895 133L900 138L895 143" fill="none" stroke="#A3C9DA" stroke-width="2"/><rect x="907" y="94" width="265" height="87" rx="10" fill="#223138"/><text x="924" y="122" fill="#A3C9DA" font-family="Arial" font-size="15">04</text><text x="924" y="154" fill="#F4F1E9" font-family="Arial" font-size="20">Explain &amp; hand over</text></svg>