name: Refresh profile
on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'profile-data.json'
      - 'scripts/refresh_profile.py'
      - '.github/workflows/refresh-profile.yml'
      - 'README.md'
      - '**/*.svg'
permissions:
  contents: write
  actions: read
concurrency:
  group: refresh-profile
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Generate public statistics and shared cards
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE_ACCOUNT: ${{ github.repository_owner }}
        run: python3 scripts/refresh_profile.py
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/dynamic
          git add -- '*.svg' 'assets/company/*.svg'
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Refresh profile facts and shared cards"
          git pull --rebase origin main
          git push origin HEAD:main
